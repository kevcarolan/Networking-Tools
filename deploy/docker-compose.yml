# From the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  netops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      NETOPS_DATA_DIR: /data
      NETOPS_CREDENTIAL_KEY_FILE: /secrets/credential.key
    volumes:
      - netops-data:/data
      - ./secrets:/secrets   # credential.key (back this up!) and your AD CA file
    restart: unless-stopped
    expose: ["8000"]         # only reachable through Caddy

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
    depends_on: [netops]

volumes:
  netops-data:
  caddy-data:
