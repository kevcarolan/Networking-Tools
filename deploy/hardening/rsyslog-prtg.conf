# Forward security-relevant messages to the PRTG syslog receiver.
# Copy to /etc/rsyslog.d/90-prtg.conf, set the target address, then:
#   rsyslogd -N1 && systemctl restart rsyslog
# Everything is still kept locally in the journal and /var/log as well.
if ($programname == "netops" and $msg contains "netops.audit")
   or $programname == "sshd"
   or $programname == "sudo"
   or ($programname == "kernel" and $msg contains "nft-")
   or ($programname startswith "audisp" and $msg contains "key=")
   or ($programname == "systemd" and $msg contains "netops")
then {
    action(type="omfwd" target="10.1.1.60" port="514" protocol="udp"
           queue.type="LinkedList" queue.size="10000" action.resumeRetryCount="-1")
}
