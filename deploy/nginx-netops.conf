# nginx in front of NetOps Tools. Installed as /etc/nginx/sites-available/netops.
# Set server_name and put the certificate (issued by your internal CA, including
# any intermediate) and its key in /etc/netops/tls/.

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name netops.corp.local;               # <-- the server's DNS name

    ssl_certificate     /etc/netops/tls/netops.crt;
    ssl_certificate_key /etc/netops/tls/netops.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:netops:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # replaces, never appends: clients can't spoof it
    proxy_set_header X-Forwarded-Proto https;

    # Firmware image uploads: large, streamed straight through to the app.
    location = /api/firmware/images/upload {
        client_max_body_size 4200m;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8000;
    }

    # PRTG health sensor: polled every minute, so keep it out of the access log.
    location = /api/monitoring/prtg {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
